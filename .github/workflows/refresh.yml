name: Refresh data and deploy

# 每天 UTC 02:00（北京时间 10:00）自动刷新一次，也可以手动触发。
# Actions 里的 GITHUB_TOKEN 配额远高于匿名访问，足以用官方 Git Tree API
# 核验绝大多数仓库；刷新结果不会写回版本库，只发布到 Pages，
# 这样仓库体积不会随每日更新膨胀。

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect GitHub skills data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 采集失败时不阻断发布，退回仓库里已提交的快照。
        continue-on-error: true
        run: |
          python tools/collect_skills.py search --pages 2 --min-stars 3
          python tools/collect_skills.py verify --verify-budget 400
          python tools/collect_skills.py scan --workers 12 --min-stars 3
          python tools/collect_skills.py emit --min-stars 3

      - name: Stage site
        run: |
          mkdir -p _site/data
          cp index.html styles.css main.js _site/
          cp data/skills.json data/skills.js data/meta.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
